[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voyager-compiler"
version = "0.2.0"
description = "A Machine Learning Compiler with native quantization support"
readme = "README.md"
authors = [
  { name = "Jeffrey Yu", email = "jeffreyy@stanford.edu" },
]
requires-python = ">=3.10"

# STABILITY FIRST: Exact versions enforced where critical.
dependencies = [
    "accelerate==1.12.0",
    "datasets==4.5.0",
    "evaluate",
    "graphviz",
    "jiwer",
    "librosa",
    "matplotlib",
    "opencv-python-headless==4.13.0.92",
    "peft==0.18.1",
    "protobuf",
    "PyYAML",
    "scikit-learn",
    "scipy",
    "sentencepiece",
    "soundfile",
    "tabulate",
    "timm",
    "torchao",
    "transformers==5.1.0",
    "wandb"
]

[project.optional-dependencies]
cpu = [
    "torch==2.8.0+cpu"
]
cuda = [
    "torch==2.8.0"
]
# Style and test tooling.  pytest is required: conversion/gemmini/test_convert.py
# is pytest-only (no unittest.TestCase, no __main__ entry point).
dev = [
    "black",
    "ruff",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["scheduler*", "voyager_compiler*"]

[tool.setuptools.package-data]
"voyager_compiler" = ["*.txt", "*.json"]

[tool.black]
line-length = 80
target-version = ["py312"]
# Generated; regenerating would undo any formatting.  force- rather than
# extend-, so it holds when the file is named explicitly on the CLI.
# ``scheduler/interstellar`` is a vendored external tree. ``examples/`` holds
# HuggingFace-derived scripts kept
# close to their upstream, which ruff already exempts for the same reason;
# without this, ``black --check .`` can never pass and is useless as a gate.
force-exclude = '''/src/scheduler/interstellar/|/libraries/|/examples/|param_pb2\.py$'''

# Linting only; black owns formatting (line-length matches it so the two agree
# on what fits).
[tool.ruff]
line-length = 80
target-version = "py312"
# Honour the excludes below for explicitly-named paths too.
force-exclude = true
# Code we do not own: Interstellar is an external repository, and the examples'
# run_*.py files are HuggingFace scripts kept close to upstream.
extend-exclude = [
    "src/scheduler/interstellar",
    # Vendored checkout, untracked but on sys.path (test/test_codegen.py:1023).
    "libraries",
    "examples/**/run_*.py",
    "**/param_pb2.py",
]

[tool.ruff.lint]
select = ["F", "I"]

[tool.ruff.lint.per-file-ignores]
# Leave the examples' import order alone; the F rules still apply to them.
"examples/**" = ["I001"]
# Package __init__ files are re-export hubs.  Their imports are the public
# surface, not dead code, so F401 does not apply.  The surface is wider than
# ``__all__`` because it was inherited from ``import *``; narrowing it is an
# API decision, not a formatting one, and is deliberately left alone here.
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["voyager_compiler", "scheduler"]
