gaps:
  - gap_id: GAP-magnet-alpha-operation-anchor-001
    affects:
      - magnet-alpha.converter
    statement: >-
      No external operation-execution anchor is packaged. Compiler and
      converter checks do not establish executed target calls.
  - gap_id: GAP-magnet-alpha-numerical-vectors-003
    affects:
      - magnet-alpha.converter
    statement: Independent durable vectors for registered arithmetic and operation forms are incomplete.
  - gap_id: GAP-magnet-alpha-performance-observations-004
    affects:
      - magnet-alpha.converter
    statement: Actual calls, matched endpoint time and traffic, utilization, and qualified peaks are unavailable.
  - gap_id: GAP-magnet-alpha-missing-converter-builders-005
    affects:
      - magnet-alpha.depthwise-vsq-nmp
      - magnet-alpha.group-norm
      - magnet-alpha.softmax
      - magnet-alpha.vsq-scale-encode
    statement: No accepted converter translation exists for these recognized or implemented forms.
  - gap_id: GAP-magnet-alpha-pool-form-guard-006
    affects:
      - magnet-alpha.max-pool2d
    statement: The adapter does not fully guard the accepted pool form.
  - gap_id: GAP-magnet-alpha-qdq-execution-007
    affects:
      - magnet-alpha.public-input-quantize-absorption
      - magnet-alpha.public-output-dequantize-absorption
    statement: >-
      Converter owner resolution exists, but no registered target-core
      implementation establishes Q/DQ computation or qparams before
      conversion. Operation-local semantic support, numerical comparison, and
      target execution remain unverified.
  - gap_id: GAP-magnet-alpha-evidence-portability-009
    affects:
      - magnet-alpha.converter
    statement: >-
      The prior model.txt snapshot is not packaged. Its retained hash supports
      comparison bookkeeping but not detached reproduction.
