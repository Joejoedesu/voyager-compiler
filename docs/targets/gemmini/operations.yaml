endpoint:
  endpoint_id: gemmini.spike-public-auto-helpers
  claim_scope: resnet18 W public-helper injection
  x_interface_status: not_selected
  accepted_artifact: >-
    Gemmini-linked RV64 bare-metal ELF derived from canonical model.txt and
    referenced tensor payloads
  adapter: conversion/gemmini/workload.py::convert_region
  interface: docs/targets/gemmini/workload-injection-contract.md
  control: partial-control
  ownership:
    voyager:
      - shared Q/DQ, Conv2d, residual Add, global-average, and Linear semantics
      - final FX, tensor identities, logical layouts, values, and qparams
      - canonical model.txt and independent complete-output oracles
      - fail-closed conversion, static packing, launch glue, and readback
    endpoint:
      - public _auto helper local tile selection and loop traversal
      - DMA, buffering, and scratchpad/accumulator windows
      - local addresses, RoCC expansion, and execution completion

quantization:
  schemes:
    - scheme_id: gemmini.s8-symmetric-per-tensor
      status: unverified
      summary: >-
        Symmetric signed INT8 activation, weight, and narrowed output with
        qmin -128, qmax 127, zero point zero, FP32 scales, and nearest-even
        rounding. The exact nonunit Conv2d R anchor and fixed ResNet-18 W
        binding pass; scheme-wide support across other forms is unverified.
      implementation:
        - src/voyager_compiler/decomposed.py::quantize
        - src/voyager_compiler/decomposed.py::conv2d
        - src/voyager_compiler/decomposed.py::dequantize
        - src/voyager_compiler/codegen/target_backends/gemmini/quantization.py
      semantic_evidence: &campaign_evidence
        - docs/targets/gemmini/regression.md
      adapter:
        - conversion/gemmini/convert.py::convert
      checks: &mixed_checks
        serialization: unverified
        adapter: unverified
        execution: unverified
        comparison: unverified
    - scheme_id: gemmini.s8-weight-per-channel-axis0
      status: unverified
      summary: >-
        Per-tensor signed-INT8 activations/output with axis-zero symmetric
        signed-INT8 weights and one derived signed-INT32 bias scale per output
        channel. Natural rows retain exact vector qparams, but no row reaches
        native comparison.
      implementation:
        - src/voyager_compiler/decomposed.py::quantize
        - src/voyager_compiler/decomposed.py::dequantize
      semantic_evidence: *campaign_evidence
      adapter: []
      checks: *mixed_checks

  qdq_forms:
    - capability_id: gemmini.s8s8-s32-full
      status: unverified
      summary: >-
        Signed-INT8 inputs and weights with the actual signed-INT32 MatMul or
        Linear accumulator and immediate dequantize. Non-Conv rows attempt
        this distinct raw form; both Conv rows are explicitly deferred and no
        Conv raw-accumulator support is claimed.
      implementation:
        - src/voyager_compiler/decomposed.py::dequantize
      semantic_evidence: *campaign_evidence
      adapter: []
      checks: *mixed_checks
    - capability_id: gemmini.s8s8-s32-to-s8-f32-rne-sat
      status: unverified
      summary: >-
        Signed-INT32 accumulation followed by a scalar FP32 multiplier,
        nearest-even rounding, zero point zero, signed-INT8 saturation, and a
        terminal FLOAT32 dequantize. The exact nonunit Conv2d anchor passes;
        broader form support is unverified.
      implementation:
        - src/voyager_compiler/decomposed.py::conv2d
        - src/voyager_compiler/decomposed.py::dequantize
        - src/voyager_compiler/decomposed.py::quantize
      semantic_evidence:
        - docs/targets/gemmini/regression.md
      adapter:
        - conversion/gemmini/convert.py::convert
      checks: *mixed_checks
    - capability_id: gemmini.s8-resadd-equal-domain
      status: unverified
      summary: >-
        Both Add inputs and output request one shared per-tensor scale and zero
        point. The R breadth probes stop at qparam validation; the separate
        fixed ResNet-18 W binding executes its eight admitted Add/ReLU regions.
      implementation: []
      semantic_evidence: *campaign_evidence
      adapter: []
      checks: *mixed_checks

semantic_fidelity:
  stage: W
  reference: >-
    For the frozen ResNet-18 x Gemmini binding, executable natural PyTorch and
    shared PT2E Q/DQ on identical frozen tensors and exact qparams. Narrowed
    output is compared in signed output-code space with rtol zero and atol one.
    Raw MatMul/Linear accumulator probes use exact signed-INT32 comparison
    before immediate dequantize.
  required: output_code_lsb
  numerical_perturbation_permitted: true
  tolerance:
    absolute: 1
    relative: 0

